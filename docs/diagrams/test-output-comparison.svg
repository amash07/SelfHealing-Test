<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><style>.title{font:700 24px Arial;fill:#0f172a}.head{font:700 19px Arial;fill:#fff}.txt{font:16px Arial;fill:#0f172a}.mono{font:15px Consolas,monospace;fill:#334155}.bad{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.good{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.neutral{fill:#f1f5f9;stroke:#64748b;stroke-width:2}</style></defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Test Runner Output Comparison</text>
  <rect x="65" y="80" width="490" height="55" rx="12" fill="#b91c1c"/><text x="310" y="115" text-anchor="middle" class="head">Without self-healing</text>
  <rect x="645" y="80" width="490" height="55" rx="12" fill="#15803d"/><text x="890" y="115" text-anchor="middle" class="head">With self-healing</text>
  <rect x="65" y="165" width="490" height="85" rx="12" class="bad"/><text x="90" y="198" class="mono">TEST 1: Login</text><text x="90" y="224" class="mono">loginButton not found</text>
  <rect x="645" y="165" width="490" height="85" rx="12" class="neutral"/><text x="670" y="198" class="mono">TEST 1: Login</text><text x="670" y="224" class="mono">loginButton lookup fails</text>
  <rect x="65" y="285" width="490" height="100" rx="12" class="bad"/><text x="90" y="320" class="txt">Test stops</text><text x="90" y="348" class="mono">TEST FAILED</text><text x="90" y="374" class="mono">workflow incomplete</text>
  <rect x="645" y="285" width="490" height="100" rx="12" class="good"/><text x="670" y="320" class="txt">DOM inspected and scored</text><text x="670" y="348" class="mono">loginBtn selected (score 100)</text><text x="670" y="374" class="mono">locator recovered</text>
  <rect x="65" y="420" width="490" height="100" rx="12" class="bad"/><text x="310" y="462" text-anchor="middle" class="txt">FAILED</text><text x="310" y="490" text-anchor="middle" class="mono">0 recovered steps</text>
  <rect x="645" y="420" width="490" height="100" rx="12" class="good"/><text x="890" y="462" text-anchor="middle" class="txt">ALL TESTS PASSED</text><text x="890" y="490" text-anchor="middle" class="mono">recovery events are reported</text>
  <text x="600" y="575" text-anchor="middle" class="txt">Self-healing changes the automation response to locator drift; it does not hide unrecoverable failures.</text>
</svg>
